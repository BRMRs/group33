name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Validate repository and pull request policy
        env:
          BRANCH_NAME: ${{ github.head_ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: >-
          python3 scripts/check_repository_policy.py
          --branch "$BRANCH_NAME"
          --pr-title "$PR_TITLE"

      - name: Verify review artifact checksums
        run: shasum -a 256 -c docs/contracts/GATE1_ARTIFACTS.sha256

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Test and build
        run: ./gradlew gate1Check test

  bound-phone-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: group33_phone_fixture
          POSTGRES_USER: group33_phone_fixture
          POSTGRES_PASSWORD: fictional-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U group33_phone_fixture -d group33_phone_fixture"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify bound phone identity on isolated PostgreSQL
        env:
          S2_PG_INTEGRATION_URL: jdbc:postgresql://127.0.0.1:5432/group33_phone_fixture
          S2_PG_INTEGRATION_USER: group33_phone_fixture
          S2_PG_INTEGRATION_PASSWORD: fictional-ci-only
        run: >-
          ./gradlew -PserverOnly :server:postgresIntegrationTest
          --tests '*PostgresBoundPhoneIdentityTest' --no-daemon
