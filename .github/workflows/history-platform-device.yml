name: History platform regressions
on:
  pull_request:
    paths:
      - 'android-app/**'
      - 'shared/**'
      - 'gradle/**'
      - '.github/workflows/history-platform-device.yml'
      - 'scripts/run_history_platform_device.py'
permissions:
  contents: read
jobs:
  history-platform:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: 27
            abi: x86
          - api: 35
            abi: x86_64
    steps:
      - name: Check out exact reviewed head and baseline
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Verify final review artifact checksums
        run: shasum -a 256 -c docs/contracts/GATE1_ARTIFACTS.sha256
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install exact test platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "emulator" "system-images;android-${{ matrix.api }};google_apis;${{ matrix.abi }}"
      - name: Enable runner-local emulator acceleration
        run: |
          test -c /dev/kvm
          sudo chmod a+rw /dev/kvm
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Prove baseline failures and all final history regressions
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/run_history_platform_device.py --api ${{ matrix.api }} --output "$RUNNER_TEMP/history-platform-${{ matrix.api }}"
      - name: Retain exact-head before and after evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: history-platform-api${{ matrix.api }}-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/history-platform-${{ matrix.api }}
          retention-days: 7
